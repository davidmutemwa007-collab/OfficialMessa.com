services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtyard
      POSTGRES_USER: courtyard
      POSTGRES_PASSWORD: courtyard
    ports:
      - "5432:5432"
    volumes:
      - courtyard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtyard -d courtyard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  courtyard_postgres:
